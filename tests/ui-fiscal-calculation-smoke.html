<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smoke UI — Memória fiscal</title>
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/app.css">
</head>
<body class="app-page">
  <main class="content">
    <section class="panel">
      <div class="sap-tab-tools">
        <span class="fiscal-auto-indicator"><strong>✓</strong> Impostos calculados automaticamente pela rota</span>
        <output id="smokeResult">Executando...</output>
      </div>
      <div id="quoteSmoke" class="sap-items-wrap"></div>
      <div id="orderSmoke" class="sap-items-wrap"></div>
      <section id="taxRuleEditor" class="panel" hidden></section>
    </section>
  </main>
  <script src="../js/config.js"></script>
  <script src="../js/utils/format.js"></script>
  <script>function formatBranchAvailability() { return ''; }</script>
  <script src="../js/orders.js"></script>
  <script src="../js/quotes.js"></script>
  <script src="../js/tax_rules.js"></script>
  <script>
    const fiscalDetails = {
      route: 'SP-SP', base_price: 580, ipi_amount: 18.85, own_icms_amount: 23.20,
      icms_st_amount: 81.17, pis_amount: null, cofins_amount: null, fcp_amount: null,
      total_taxes: 100.02, final_price: 680.02, calculation_profile: 'LEGACY_REVENDA',
      own_icms_included_in_total: false
    };
    const smokeItem = {
      codigo: '7175526020', descricao: 'CAIXA DIR.HID.(S/PV) TYT.HLX 05-15', marca: 'TOYOTA', aplicacao: 'HILUX / SW4',
      preco_sem_imposto: 580, tributos: 100.02, preco: 680.02, quantidade: 1, desconto_percentual: 0,
      fiscal_status: 'OK', fiscal_details: fiscalDetails, commercial_availability: 'DISPONIVEL', commercial_available_qty: '50+',
      fiscal_warnings: ['PIS_NAO_DEFINIDO', 'COFINS_NAO_DEFINIDO', 'FCP_NAO_DEFINIDO']
    };
    document.getElementById('quoteSmoke').innerHTML = renderSapQuoteItemsTable([smokeItem]);
    document.getElementById('orderSmoke').innerHTML = renderSapOrderItemsTable([smokeItem]);
    showFiscalTaxRuleEditor({
      id: 'smoke-rule', ncm: '87089483', uf_origem: 'SP', uf_destino: 'SP', has_st: true,
      resale_calculation_method: 'RATE_DIFFERENCE', resale_icms_st_rate: 0.13994828,
      resale_include_own_icms: false, effective_from: '2026-08-26', active: true
    });
    const text = document.body.textContent;
    const passed = [
      'Perfil Revenda (portal atual)', 'Rota SP→SP', 'IPI R$ 18,85',
      'ICMS próprio R$ 23,20 (referência, não somado)', 'ICMS-ST R$ 81,17',
      'PIS sem alíquota na fonte SAP (não incluído)', 'R$ 680,02', 'Cálculo para Revenda'
    ].every((value) => text.includes(value))
      && document.getElementById('taxRuleResaleMethod').value === 'RATE_DIFFERENCE'
      && Math.abs(Number(document.getElementById('taxRuleResaleIcmsSt').value) - 13.994828) < 0.000001
      && document.getElementById('taxRuleResaleOwnIcms').value === 'false';
    document.getElementById('smokeResult').value = passed ? 'PASS' : 'FAIL';
    document.documentElement.dataset.smoke = passed ? 'pass' : 'fail';
  </script>
</body>
</html>
