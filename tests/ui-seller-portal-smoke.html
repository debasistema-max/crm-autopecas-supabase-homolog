<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smoke UI — Portal do vendedor</title>
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/app.css">
  <link rel="stylesheet" href="../css/seller.css">
</head>
<body class="app-page">
  <output id="smokeResult" hidden>Executando</output>
  <div class="app-shell">
    <button class="sidebar-backdrop" id="sidebarBackdrop" type="button" aria-label="Fechar menu"></button>
    <aside class="sidebar" id="sidebar" aria-label="Navegacao principal">
      <div class="sidebar-header"><a class="sidebar-brand" href="#dashboard"><img src="../assets/logo-neutral.svg" alt="" class="sidebar-logo"><span class="sidebar-brand-copy"><strong>IPS do Brasil</strong><small>Portal Comercial</small></span></a></div>
      <nav class="side-nav">
        <section class="nav-group" data-nav-group>
          <h2 class="nav-group-label">Comercial</h2>
          <button class="nav-item" data-module="dashboard" type="button"><span class="nav-label">Inicio</span></button>
          <button class="nav-item" data-module="partners" type="button"><span class="nav-label">Parceiros</span></button>
          <button class="nav-item" data-module="quoteReports" type="button"><span class="nav-label">Cotacoes</span></button>
          <button class="nav-item" data-module="ordersReport" type="button"><span class="nav-label">Pedidos</span></button>
          <button class="nav-item" data-module="products" type="button"><span class="nav-label">Produtos</span></button>
        </section>
      </nav>
      <div class="sidebar-footer"><button class="sidebar-collapse" id="sidebarCollapseButton" type="button"><span class="sidebar-collapse-icon">‹</span><span class="sidebar-collapse-label">Recolher menu</span></button></div>
    </aside>
    <section class="workspace">
      <header class="topbar">
        <button class="icon-button" id="menuButton" type="button" aria-label="Abrir menu"></button>
        <a class="seller-brand" href="#dashboard" hidden aria-label="Portal do vendedor"><img src="../assets/logo-ips-yokomitsu.png" alt="IPS do Brasil"><span><strong>Portal do vendedor</strong><small>IPS do Brasil · Yokomitsu</small></span></a>
        <div class="topbar-title"><p class="topbar-kicker" id="pageContext">Comercial</p><h1 id="pageTitle">Inicio</h1></div>
        <div class="topbar-user"><span class="topbar-user-copy"><strong id="userName">Vendedor</strong><small id="userRole">VENDEDOR</small></span><button class="btn btn-ghost" id="logoutButton" type="button">Sair</button></div>
      </header>
      <nav class="seller-nav" id="sellerNav" aria-label="Navegação do vendedor" hidden></nav>
      <main class="content" id="content" tabindex="-1"></main>
    </section>
  </div>
  <nav class="mobile-nav" id="mobileNav" aria-label="Acesso rapido">
    <button type="button" data-mobile-module="dashboard" data-seller-only hidden><span class="mobile-nav-icon" aria-hidden="true">IN</span><span>Inicio</span></button>
    <button type="button" data-mobile-module="products"><span class="mobile-nav-icon" aria-hidden="true">PR</span><span>Produtos</span></button>
    <button type="button" data-mobile-module="partners"><span class="mobile-nav-icon" aria-hidden="true">CL</span><span>Clientes</span></button>
    <button type="button" data-mobile-module="ordersReport"><span class="mobile-nav-icon" aria-hidden="true">PD</span><span>Pedidos</span></button>
    <button type="button" data-mobile-module="quoteReports"><span class="mobile-nav-icon" aria-hidden="true">CT</span><span>Cotacoes</span></button>
  </nav>
  <script src="../js/config.js"></script>
  <script src="../js/utils/format.js"></script>
  <script src="../js/components/ui.js"></script>
  <script src="../js/supabase_store.js"></script>
  <script>
    const sellerSession = {
      nome: 'Marina Vendas', usuario: 'marina', perfil: 'VENDEDOR',
      modules: ['dashboard', 'produtos', 'parceiros', 'cotacoes', 'nova_cotacao', 'pedidos', 'novo_pedido']
    };
    const sellerSmokeParams = new URLSearchParams(location.search);
    if (sellerSmokeParams.has('bulk')) window.confirm = () => true;
    if (sellerSmokeParams.get('role') === 'admin') sellerSession.perfil = 'ADMIN';
    if (sellerSmokeParams.get('permission')) sellerSession.modules = [sellerSmokeParams.get('permission')];
    function getStoredSession() { return sellerSession; }
    async function validateCurrentSession() { return sellerSession; }
    async function loadCompanySettings() { return {}; }
    function formatCompanyBranchLabel() { return 'IPS do Brasil'; }
    function formatCnpj(value) { return String(value || ''); }
    function formatDateInput(value) { return new Date(value).toISOString().slice(0, 10); }
    function dateInputToIsoStart(value) { return value ? new Date(`${value}T00:00:00`).toISOString() : ''; }
    function dateInputToIsoEnd(value) { const date = new Date(`${value}T00:00:00`); date.setDate(date.getDate() + 1); return value ? date.toISOString() : ''; }
    function isSupabaseReady() { return false; }
    async function supabaseListOrdersReport() { return []; }
    async function supabaseListQuotationsReport() { return []; }
    async function supabaseCreateOrder() { throw new Error('Teste visual: gravação desativada.'); }
    async function supabaseCreateQuotation() { throw new Error('Teste visual: gravação desativada.'); }
    async function supabaseLogout() {}
    function clearStoredSession() {}
    async function supabaseGetCommercialDashboardSummary() {
      return {
        meta: { fallback: false, version: 'smoke' },
        access: { scope: 'own', can_filter_seller: false, can_view_seller_ranking: false, can_view_stock: false, can_view_imports: false },
        kpis: { orders_count: 8, orders_value: 18450.35, quotations_count: 13, quotations_value: 32780.50, pending_quotations: 4, approved_quotations: 7, conversion_rate: 53.84, average_ticket: 2306.29, active_clients: 6, products_sold: 41, converted_quotations: 7 },
        orders: { by_status: [{ status: 'APROVADO', count: 8, total_value: 18450.35 }] },
        quotations: { by_status: [{ status: 'ENVIADA', count: 6, total_value: 14220.40 }] },
        rankings: { sellers: [], products: [], clients: [] }, abc_curve: [], series: [], sellers: []
      };
    }
    const sellerSampleProducts = [
      { codigo: 'DEMO-DIRECAO', descricao: 'CAIXA DE DIREÇÃO HIDRÁULICA', linha: 'DIRECAO', grupo: 'AUTOPECAS', aplicacao: 'TOYOTA HILUX 2005–2015', estoque: 18, preco: 580, preco_sp: 580, preco_pr: 564, ativo: true },
      { codigo: 'DEMO-FAROL', descricao: 'FAROL DIANTEIRO DIREITO', linha: 'ILUMINACAO', grupo: 'AUTOPECAS', aplicacao: 'LINHA LEVE · REPOSIÇÃO', estoque: 32, preco: 348.90, preco_sp: 348.90, preco_pr: 337.50, ativo: true },
      { codigo: 'DEMO-RETROVISOR', descricao: 'RETROVISOR EXTERNO ESQUERDO', linha: 'RETROVISORES', grupo: 'AUTOPECAS', aplicacao: 'UTILITÁRIOS · MANUAL', estoque: 0, preco: 189.50, preco_sp: 189.50, preco_pr: 182.80, ativo: true }
    ];
    if (sellerSmokeParams.has('photo')) sellerSampleProducts[0].url_imagem = '../assets/logo-ips-yokomitsu.png';
    if (sellerSmokeParams.has('inactive')) sellerSampleProducts[2].ativo = false;
    if (sellerSmokeParams.has('ips')) sellerSampleProducts[0].detalhes = 'Observacao original preservada\n\n[CATALOGO_IPS_INSTALADO]\nOrigem: Catalogo IPS instalado\nMarca: IPS\nEAN/GTIN: 7898778850018\nDimensoes informadas no catalogo: Altura: 32 | Largura: 14.5\nVeiculos / anos informados no catalogo:\nTOYOTA | HILUX 2005-2015\n[/CATALOGO_IPS_INSTALADO]';
    async function supabaseListProductFilters() { return { linhas: ['DIRECAO', 'ILUMINACAO', 'RETROVISORES'], grupos: ['AUTOPECAS'], montadoras: ['TOYOTA'] }; }
    async function supabaseListProductFavorites() { return []; }
    async function supabaseListRecentProducts() { return sellerSampleProducts.slice(0, 1); }
    async function supabaseGetTopSellingProducts() { return sellerSampleProducts.slice(0, 1); }
    async function supabaseSearchProducts(params = {}) {
      return sellerSampleProducts.filter((p) => (params.incluirInativos || p.ativo !== false) && (!params.termo || p.descricao.toLowerCase().includes(params.termo.toLowerCase()) || p.codigo.toLowerCase().includes(params.termo.toLowerCase())) && (!params.linha || p.linha === params.linha) && (!params.disponiveis || p.estoque > 0))
        .map((p) => ({ ...p, preco: params.regiao === 'PR' ? p.preco_pr : p.preco_sp }));
    }
    async function supabaseToggleProductFavorite(code, enabled) { return enabled ? [code] : []; }
    async function supabaseDeactivateProducts(items) {
      const rows = items.map((item) => {
        const product = sellerSampleProducts.find((p) => p.codigo === item.codigo);
        if (!product || product.ativo !== item.expected_active) throw new Error('Fixture alterada.');
        product.ativo = false;
        return { codigo: item.codigo, ativo: false, changed: true };
      });
      return { rows, count: rows.length, changed: rows.length };
    }
    async function supabaseSetProductActive(code, active) {
      sellerSampleProducts.find((p) => p.codigo === code).ativo = active;
      return { codigo: code, ativo: active };
    }
    async function supabaseRegisterProductView() {}
    async function supabaseGetProductHistory() { return { prices: [], stock: [] }; }
    async function renderStockTransfers() {}
    async function renderBusinessPartners(container) { container.innerHTML = '<section class="panel"><h2>Clientes</h2></section>'; }
    async function renderDataSyncCenter() {}
    async function renderImportCenter() {}
    async function renderCadastrosClientes() {}
    async function renderPortalCadastrosControle() {}
    async function renderCompanySettings() {}
    async function renderFiscalTaxRules() {}
    async function renderUsers() {}
    async function renderLogs() {}
  </script>
  <script src="../js/dashboard.js"></script>
  <script src="../js/products.js"></script>
  <script src="../js/orders.js"></script>
  <script src="../js/quotes.js"></script>
  <script src="../js/app.js"></script>
  <script>
    window.addEventListener('load', () => {
      setTimeout(async () => {
        if (sellerSmokeParams.has('bulk') && sellerSession.perfil === 'ADMIN') {
          document.getElementById('productInactiveFilter').checked = true;
          await runProductSearch({ listaGeral: true });
          const select = document.getElementById('productSelectDisplayed');
          select.checked = true;
          select.dispatchEvent(new Event('change', { bubbles: true }));
          await deactivateSelectedProducts();
          const passed = sellerSampleProducts.every((product) => !product.ativo)
            && document.getElementById('productSelectionCount').textContent === '0 selecionados'
            && document.getElementById('productMessage').textContent.includes('2 itens inativados');
          document.documentElement.dataset.bulk = passed ? 'pass' : 'fail';
          document.getElementById('productResults').scrollIntoView({ block: 'start' });
          return;
        }
        const mobileItems = Array.from(document.querySelectorAll('[data-mobile-module]')).filter((item) => !item.hidden);
        const dashboardPassed = document.body.classList.contains('seller-portal-mode')
          && mobileItems.length === 5
          && document.querySelector('.seller-welcome');
        if (new URLSearchParams(location.search).has('stay')) {
          document.documentElement.dataset.smoke = dashboardPassed ? 'pass' : 'fail';
          document.getElementById('smokeResult').value = dashboardPassed ? 'PASS' : 'FAIL';
          return;
        }
        document.querySelector('[data-mobile-module="products"]').click();
        await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
        const passed = dashboardPassed
          && document.querySelector('.product-shell')
          && location.hash === '#products';
        document.documentElement.dataset.smoke = passed ? 'pass' : 'fail';
        document.getElementById('smokeResult').value = passed ? 'PASS' : 'FAIL';
      }, 80);
    });
  </script>
</body>
</html>
