<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smoke UI — Relatorios e edicao comercial</title>
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/app.css">
</head>
<body class="app-page">
  <output id="smokeResult" hidden>Executando</output>
  <main class="content" id="content" tabindex="-1"></main>
  <script src="../js/config.js"></script>
  <script src="../js/utils/format.js"></script>
  <script src="../js/components/ui.js"></script>
  <script>
    var cachedCompanySettings = { company_name: 'International Parts Service do Brasil Ltda' };
    var DEFAULT_COMPANY_SETTINGS = cachedCompanySettings;
    let commercialPriceCalls = 0;
    let mutationCalls = 0;

    function getStoredSession() { return { nome: 'Administrador Homologacao', perfil: 'ADMIN', modules: [] }; }
    function formatCompanyBranchLabel() { return 'International Parts Service do Brasil Ltda'; }
    function formatDateInput(value) { return new Date(value).toISOString().slice(0, 10); }
    function dateInputToIsoStart(value) { return value ? value + 'T00:00:00.000Z' : null; }
    function dateInputToIsoEnd(value) { return value ? value + 'T23:59:59.999Z' : null; }
    function formatCnpj(value) { return String(value || ''); }
    function formatDateTime() { return '27/08/2026 10:30'; }
    function formatStockTransferStatus(value) { return value || ''; }
    function formatTransferQty(value) { return String(value == null ? '-' : value); }
    function openModule() {}
    function searchProductsInto() {}
    async function supabaseGetProductCommercialPrice() { commercialPriceCalls += 1; return {}; }
    async function supabaseListOrderTransferRequests() { return []; }
    async function supabaseUpdateOrderReport() { mutationCalls += 1; return {}; }
    async function supabaseUpdateQuotationReport() { mutationCalls += 1; return {}; }
    async function supabaseUpdateOrderStatus() { mutationCalls += 1; return {}; }
    async function supabaseUpdateQuotationStatus() { mutationCalls += 1; return {}; }
    async function supabaseConvertQuotationToOrder() { mutationCalls += 1; return {}; }

    const fiscalItem = {
      item: 1,
      codigo: '6111032201',
      descricao: 'FAROL AUXILIAR DIREITO',
      marca: 'IPS',
      aplicacao: 'HILUX 2016+',
      preco_unitario: 347.85446,
      quantidade: 1,
      desconto_percentual: 0,
      preco_sem_imposto_unitario: 232,
      imposto_unitario: 115.85446,
      fiscal_tax_rule_id: 'rule-pr-pr-85122011-v1',
      fiscal_status: 'OK',
      fiscal_details: {
        route: 'PR-PR',
        ncm: '85122011',
        origin_state: 'PR',
        destination_state: 'PR',
        customer_type: 'REVENDA',
        ipi_amount: 22.62,
        own_icms_amount: 27.84,
        icms_st_amount: 65.39446,
        pis_amount: null,
        cofins_amount: null,
        fcp_amount: null
      }
    };

    function makeDocument(kind) {
      return {
        id: kind + '-smoke-id',
        numero_cotacao: 'COT-2026-0001',
        numero_pedido: 'PED-2026-0001',
        created_at: '2026-08-27T13:30:00Z',
        regiao: 'PR',
        cliente: 'CLIENTE TESTE LTDA',
        cnpj: '13180109000108',
        codigo_sap_cliente: '1',
        telefone: '4130864388',
        endereco: 'CURITIBA/PR',
        vendedor: 'Administrador Homologacao',
        status: kind === 'pedidos' ? 'NOVO' : 'NOVA',
        total: 347.85446,
        prazo: '30/60/90',
        transportadora: 'TRANSPORTADORA TESTE',
        transportadora_cnpj: '12345678000199',
        transfer_summary: { total: 0 },
        quotation_items: [fiscalItem],
        order_items: [fiscalItem]
      };
    }

    async function supabaseListQuotationsReport() { return [makeDocument('cotacoes')]; }
    async function supabaseListOrdersReport() { return [makeDocument('pedidos')]; }
  </script>
  <script src="../js/orders.js"></script>
  <script src="../js/quotes.js"></script>
  <script>
    (async () => {
      const kind = new URLSearchParams(location.search).get('kind') === 'pedidos' ? 'pedidos' : 'cotacoes';
      if (kind === 'pedidos') await renderOrdersReport(document.getElementById('content'));
      else await renderQuotationsReport(document.getElementById('content'));
      document.querySelector('[data-edit-document]').click();
      await new Promise((resolve) => setTimeout(resolve, 30));
      CrmUi.observeResponsiveTables(document.querySelector('main'));
      await new Promise((resolve) => setTimeout(resolve, 0));

      const reportRow = document.querySelector('.document-report-table tbody tr');
      const editPanel = document.getElementById(kind + 'EditPanel');
      const text = editPanel.textContent.replace(/\s+/g, ' ');
      const preservedItem = (window[kind + 'EditingItems'] || [])[0];
      const passed = Boolean(reportRow)
        && !editPanel.hidden
        && text.includes('Snapshot preservado')
        && text.includes('8512.20.11')
        && text.includes('R$ 232,00')
        && text.includes('R$ 115,85')
        && text.includes('R$ 347,85')
        && text.includes('IPI R$ 22,62')
        && text.includes('ICMS próprio R$ 27,84')
        && text.includes('ICMS-ST R$ 65,39')
        && preservedItem.fiscal_tax_rule_id === 'rule-pr-pr-85122011-v1'
        && Math.abs(preservedItem.preco - 347.85446) < 0.000001
        && commercialPriceCalls === 0
        && mutationCalls === 0;

      document.getElementById('smokeResult').value = passed ? 'PASS' : 'FAIL';
      document.documentElement.dataset.smoke = passed ? 'pass' : 'fail';
      document.documentElement.dataset.kind = kind;
    })();
  </script>
</body>
</html>
