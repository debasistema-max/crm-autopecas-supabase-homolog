<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="../b2b/css/portal.css">
  <link rel="stylesheet" href="../b2b/css/catalog.css">
  <title>Smoke B2B</title>
</head>
<body>
  <output id="smokeResult" hidden>Executando</output>
  <main id="authView" class="auth-shell" hidden><section class="auth-card"><form id="loginForm"><input id="loginIdentifier"><input id="loginPassword"><button></button><button id="forgotPassword"></button><p id="loginMessage"></p></form><form id="passwordForm" hidden><p id="passwordHelp"></p><input id="newPassword"><input id="confirmPassword"><button></button><p id="passwordMessage"></p></form></section></main>
  <div id="portalView" class="portal" hidden>
    <header class="topbar"><div class="brand"><img><div><strong>Portal B2B</strong><small id="companyName"></small></div></div><div><span id="routeBadge"></span><button id="logoutButton"></button></div></header>
    <nav class="portal-nav"><button data-view="home"></button><button data-view="catalog"></button><button data-view="quotes"></button><button data-view="orders"></button><button data-view="profile"></button></nav>
    <main class="portal-content"><section id="homeView" class="view"></section><section id="catalogView" class="view" hidden></section><section id="quotesView" class="view" hidden></section><section id="ordersView" class="view" hidden></section><section id="profileView" class="view" hidden></section></main>
    <button id="cartButton" class="cart-fab" hidden><span id="cartCount">0</span></button>
  </div>
  <dialog id="cartDialog"><div id="cartContent"></div></dialog><dialog id="documentDialog"><div id="documentContent"></div></dialog>
  <script>
    const B2B_CONFIG={supabaseUrl:'https://example.invalid',anonKey:'public-test-key',locale:'pt-BR',currency:'BRL'};
    const smokeCalls=[];
    const smokeSession={user:{id:'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa'},access_token:'test'};
    const fakeClient={
      auth:{getSession:async()=>({data:{session:smokeSession}}),onAuthStateChange:()=>({data:{subscription:{unsubscribe(){}}}}),signOut:async()=>({}),signInWithPassword:async()=>({data:{session:smokeSession}}),resetPasswordForEmail:async()=>({}),updateUser:async()=>({})},
      rpc:async(name,args)=>{smokeCalls.push({name,args});if(name==='get_b2b_session')return{data:{account:{user_id:smokeSession.user.id,username:'11111111000111',login_mode:'USERNAME',must_change_password:false,contact_name:'Ana',can_create_orders:true,can_create_quotations:true},client:{id:'client-a',nome:'Cliente A Ltda',nome_fantasia:'Cliente A',codigo_sap_cliente:'1001',cnpj:'11111111000111',estado:'SC',cidade:'Joinville'},route:'PR-SC',route_supported:true},error:null};if(name==='b2b_list_documents')return{data:[],error:null};if(name==='b2b_list_catalog_lines')return{data:[{value:'ILUMINACAO',label:'ILUMINAÇÃO'},{value:'DIRECAO',label:'DIREÇÃO'}],error:null};if(name==='b2b_search_catalog')return{data:[{product_code:'6111032201',description:'Farol auxiliar',brand:'IPS',application:'Hilux',route:'PR-SC',final_price:254.62,availability:'DISPONIVEL',available_qty:12,source_display_value:'12'}],error:null};if(name==='b2b_create_document')return{data:{id:'doc-a',numero_cotacao:'000101',total:254.62},error:null};if(name==='complete_b2b_password_change')return{data:{completed:true},error:null};return{data:null,error:{message:'RPC inesperada '+name}};}
    };
    window.supabase={createClient:()=>fakeClient};
  </script>
  <script src="../b2b/js/app.js"></script>
  <script>
    (async()=>{
      await new Promise(resolve=>setTimeout(resolve,80));
      await navigate('catalog');
      document.getElementById('catalogTerm').value='farol hilux';
      document.getElementById('catalogLine').value='ILUMINACAO';
      document.getElementById('catalogSearch').dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));
      await new Promise(resolve=>setTimeout(resolve,50));
      document.querySelector('[data-add]').click();
      openCart();
      await submitDocument();
      await new Promise(resolve=>setTimeout(resolve,30));
      const text=document.body.innerText;
      const passed=document.getElementById('companyName').textContent==='Cliente A'
        && document.getElementById('routeBadge').textContent==='PR-SC'
        && text.includes('Farol auxiliar')
        && text.includes('R$')
        && document.querySelector('[data-product-image]').src.includes('/uploads/products/6111032201/site/6111032201.webp')
        && !text.includes('Cliente B')
        && smokeCalls.some(call=>call.name==='b2b_search_catalog'&&call.args.search_term==='farol hilux'&&call.args.line_filter==='ILUMINACAO')
        && smokeCalls.some(call=>call.name==='b2b_create_document'&&call.args.payload.items[0].codigo==='6111032201');
      document.documentElement.dataset.smoke=passed?'pass':'fail';
      document.getElementById('smokeResult').value=passed?'PASS':'FAIL';
    })();
  </script>
</body>
</html>
